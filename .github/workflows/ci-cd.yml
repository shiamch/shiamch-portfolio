name: CI/CD to AWS EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at the same time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, Test, Build and Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Start Preview Server
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &

      - name: Health Check
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ | grep -q 'id="root"'; then
              echo "Site is healthy!"
              exit 0
            fi

            echo "Waiting for preview server... ($i/30)"
            sleep 2
          done

          echo "Health check failed"
          cat preview.log
          exit 1

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: ci
    # Deploy only from main (push or manual run), never from a pull request.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_HOST_FINGERPRINT: ${{ vars.EC2_HOST_FINGERPRINT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          test -n "$EC2_HOST_FINGERPRINT" || {
            echo "Set EC2_HOST_FINGERPRINT repository variable"
            exit 1
          }

          ssh-keyscan -t ed25519 -H "$EC2_HOST" > ~/.ssh/known_hosts 2>/dev/null

          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 \
            | grep -F "$EC2_HOST_FINGERPRINT" || {
              echo "EC2 SSH host fingerprint mismatch"
              exit 1
            }

          chmod 600 ~/.ssh/known_hosts

      - name: Copy Build to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          tar -czf /tmp/dist.tar.gz -C dist .

          scp -i ~/.ssh/ec2_key -o StrictHostKeyChecking=yes \
            /tmp/dist.tar.gz \
            ubuntu@"$EC2_HOST":/tmp/dist.tar.gz

      - name: Release and Health Check on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=yes \
            ubuntu@"$EC2_HOST" "bash -s -- $GITHUB_SHA" <<'EOF'
          set -euo pipefail

          SITE_DIR="/var/www/portfolio"
          RELEASE_DIR="$SITE_DIR/releases/$1"

          # 1. Unpack this build into its own release folder
          mkdir -p "$RELEASE_DIR"
          tar -xzf /tmp/dist.tar.gz -C "$RELEASE_DIR"
          rm -f /tmp/dist.tar.gz

          # 2. Point "current" at the new release (Nginx serves "current")
          PREVIOUS=$(readlink -f "$SITE_DIR/current" || true)
          ln -sfn "$RELEASE_DIR" "$SITE_DIR/current"

          # 3. Check the live site; roll back if it is broken
          for i in {1..10}; do
            if curl --fail --silent http://127.0.0.1/ | grep -q 'id="root"'; then
              echo "EC2 deployment successful!"

              # Keep only the 5 newest releases
              ls -1dt "$SITE_DIR"/releases/* | tail -n +6 | xargs -r rm -rf
              exit 0
            fi

            echo "Waiting... ($i/10)"
            sleep 2
          done

          echo "Health check failed, rolling back"
          if [ -n "$PREVIOUS" ]; then
            ln -sfn "$PREVIOUS" "$SITE_DIR/current"
          fi
          exit 1
          EOF

      - name: Deployment Complete
        run: echo "CI/CD pipeline completed successfully!"
